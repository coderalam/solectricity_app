name: solectricity_app
description: "A Solar Electricity Calculator app based on BCSIR and SREDA formulas."
publish_to: 'none'

# নতুন আপডেটেড ভার্সন কোড
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # এসেট ও ছবির ফোল্ডার
  assets:
    - assets/images/