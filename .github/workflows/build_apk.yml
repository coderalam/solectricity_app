name: Build Solectricity App (APK and AAB)

# main বা master ব্রাঞ্চে কোড পুশ করলে এটি চালু হবে
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি থেকে কোড নামানো
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # ২. জাভা ১৭ সেটআপ করা
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৩. ফ্লাটার এসডিকে সেটআপ করা
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ৪. প্যাকেজ ডাউনলোড করা
      - name: Install Dependencies
        run: flutter pub get

      # ৫. ফোনে চালানোর জন্য Release APK তৈরি করা
      - name: Build Android Release APK
        run: flutter build apk --release

      # ৬. গুগল প্লে-স্টোরের জন্য Release AAB তৈরি করা
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      # ৭. তৈরি হওয়া APK ফাইলটি আপলোড করা (Artifact 1)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solectricity-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ৮. তৈরি হওয়া AAB ফাইলটি আপলোড করা (Artifact 2)
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solectricity-google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab