name: Build Solectricity App APK

# main বা master ব্রাঞ্চে কোড পুশ করলে কিংবা ম্যানুয়ালি রান করলে বিল্ড শুরু হবে
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি থেকে কোড চেকআউট করা
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # ২. জাভা ১৭ (JDK 17) সেটআপ করা
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৩. ফ্লাটার এসডিকে সেটআপ করা
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ৪. প্যাকেজ ডিপেনডেন্সি (sensors_plus, flutter_compass ইত্যাদি) ডাউনলোড করা
      - name: Install Dependencies
        run: flutter pub get

      # ৫. রিলিজ মোডে Android APK ফাইল বিল্ড করা
      - name: Build Android Release APK
        run: flutter build apk --release

      # ৬. তৈরি হওয়া APK ফাইলটি ডাউনলোডের জন্য আপলোড করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solectricity-v1.0.1-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk